name: build-and-deploy

# Les sources tombent régulièrement : le site du Collège passe en maintenance
# (redirection vers /maintenance.html), répond 502/504, et YouTube renvoie des
# 404 intermittents depuis les IP de datacenter. build.py sort alors avec le
# code 75 (EX_TEMPFAIL) : ce n'est pas une erreur du projet, le run est marqué
# réussi avec un avertissement, rien n'est déployé et la page en ligne reste.
# Le workflow n'échoue (donc n'alerte) que dans deux cas : un vrai bug de build
# (autre code de sortie) ou une page en ligne plus vieille que MAX_STALE_DAYS,
# signe que les sources sont en panne depuis trop longtemps. Ce second contrôle
# n'échoue qu'au créneau planifié du matin (ou sur push / lancement manuel) :
# une panne longue vaut un mail par jour, pas un par exécution.
on:
  schedule:
    - cron: '23 6 * * *'   # ~08h23 Paris l'été — minutes décalées des créneaux surchargés
    - cron: '41 12 * * *'  # ~14h41
    - cron: '7 18 * * *'   # ~20h07 — les maintenances du matin durent parfois la journée
  workflow_dispatch:
    inputs:
      simulate:
        description: "Simuler un résultat de build.py (test des chemins du workflow)"
        type: choice
        options: [aucun, sources-indisponibles, bug]
        default: aucun
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  MAX_STALE_DAYS: 7

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.gen.outputs.built }}
    steps:
      - uses: actions/checkout@v4
      - name: Générer la page depuis les flux
        id: gen
        env:
          SIMULATE: ${{ inputs.simulate }}
        run: |
          rc=0
          case "$SIMULATE" in
            sources-indisponibles) echo "simulation : sources indisponibles"; rc=75 ;;
            bug) echo "simulation : bug"; rc=1 ;;
            *) python3 build.py || rc=$? ;;
          esac
          case $rc in
            0)  echo "built=true" >> "$GITHUB_OUTPUT" ;;
            75) echo "built=false" >> "$GITHUB_OUTPUT"
                echo "::warning::Sources indisponibles : build abandonné, la page en ligne est conservée." ;;
            *)  echo "::error::build.py a échoué (code $rc)"; exit "$rc" ;;
          esac
      - name: Vérifier l'âge de la page en ligne
        if: >-
          steps.gen.outputs.built == 'false'
          && (github.event_name != 'schedule' || github.event.schedule == '23 6 * * *')
        run: |
          url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          lm=$(curl -sSIL --max-time 30 "$url" | tr -d '\r' \
               | awk -F': ' 'tolower($1) == "last-modified" { v = $2 } END { print v }')
          if [ -z "$lm" ]; then
            echo "::warning::Impossible de dater la page en ligne ($url)"
            exit 0
          fi
          age=$(( ( $(date -u +%s) - $(date -u -d "$lm" +%s) ) / 86400 ))
          echo "page en ligne datée du $lm, soit $age jour(s)"
          if [ "$age" -ge "$MAX_STALE_DAYS" ]; then
            echo "::error::Sources indisponibles et page en ligne vieille de $age jours (seuil : $MAX_STALE_DAYS)"
            exit 1
          fi
      - name: Préparer le site
        if: steps.gen.outputs.built == 'true'
        run: mkdir -p _site && cp index.html _site/
      - uses: actions/upload-pages-artifact@v3
        if: steps.gen.outputs.built == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.built == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
