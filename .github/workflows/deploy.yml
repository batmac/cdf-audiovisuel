name: build-and-deploy

# YouTube répond parfois 404 depuis certains runners (blocage intermittent des
# IP de datacenter, surtout aux créneaux cron très fréquentés). build.py échoue
# alors volontairement : on ne déploie jamais une page dégradée. Le premier
# échec n'est pas bloquant : on retente une fois sur un runner neuf (autre IP),
# et seule la double panne fait échouer le workflow.
on:
  schedule:
    - cron: '23 6 * * *'  # ~08h23 Paris l'été — minutes décalées des créneaux surchargés
    - cron: '41 12 * * *' # seconde passe de la journée
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Forcer l'échec du premier build (test du chemin de retry)"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.gen.outcome }}
    steps:
      - uses: actions/checkout@v4
      - name: Générer la page depuis les flux
        id: gen
        continue-on-error: true
        env:
          SIMULATE_FAILURE: ${{ inputs.simulate_failure }}
        run: |
          if [ "$SIMULATE_FAILURE" = "true" ]; then echo "échec simulé"; exit 1; fi
          python3 build.py
      - name: Préparer le site
        if: steps.gen.outcome == 'success'
        run: mkdir -p _site && cp index.html _site/
      - uses: actions/upload-pages-artifact@v3
        if: steps.gen.outcome == 'success'
        with:
          path: _site

  build-retry:
    needs: build
    if: needs.build.outputs.ok != 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Générer la page (seconde tentative, runner neuf)
        run: python3 build.py
      - name: Préparer le site
        run: mkdir -p _site && cp index.html _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: [build, build-retry]
    if: always() && (needs.build.outputs.ok == 'success' || needs.build-retry.result == 'success')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
